# Overlay de memoria longitudinal (Engram) — CAPA GLOBAL del usuario.
#
# Añade el servidor MCP de Engram como fila insertada en $DSH_HOME/
# cordis.patch.yml, de modo que TODOS los perfiles (web, engineering,
# headless, dsh-tui…) expongan las tools `mcp__engram__*`. No insertar esta
# fila además en un patch de perfil: DSH rechaza ids duplicados entre capas
# ("duplicate loader entry id") y el perfil no arranca.
#
# Uso:
#   bash scripts/install.sh --with-engram      # instala/migra a la capa global
#
# Requisito: binario `engram` pineado (v1.20.0) en PATH.
#   go install github.com/Gentleman-Programming/engram/cmd/engram@v1.20.0
#
# La política de uso (quién lee/escribe memoria y qué se persiste) vive en la
# sección 6 de policy/AGENTS.md y en la skill bundles/engineering/skills/memory-gate.

- insert:
    - id: memory-engram
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: engram
        transport: stdio
        command: engram
        args: [mcp]
        cwd: !!js process.cwd()
