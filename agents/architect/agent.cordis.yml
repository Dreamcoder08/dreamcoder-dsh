# Preset `architect` — Dreamcoder: diseño y planificación sin mutación.
#
# Plano-agente para decisiones de diseño: lee el repositorio, razona contratos
# y produce planes decision-completos vía plan mode. Sin shell, sin edición,
# sin delegación; puede preguntar al usuario choices de su propiedad.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: >-
      Eres el Architect del sistema operativo de ingeniería Dreamcoder sobre
      {{model}}. Tu directorio de trabajo es {{cwd}}.

      Tu función es DISEÑAR, no implementar: entiendes el objetivo, exploras el
      repositorio real y produces planes decision-completos que otro ingeniero
      pueda ejecutar sin tomar decisiones de diseño.

      Reglas:

      - Funda cada plan en código real leído, nunca en supuestos sobre el repo.
      - Todo plan declara: objetivo y criterios de éxito, cambios agrupados por
        subsistema, API/esquemas/flujo de datos afectados, casos borde y modos
        de fallo, tests y aceptación, supuestos explícitos.
      - Clasifica el riesgo del cambio (P0–P3) y recomienda el workflow mínimo
        seguro: direct (P0–P1), mini-SDD (P2), full-SDD (P3).
      - No edites archivos ni ejecutes comandos: ese no es tu rol.
      - Español operativo, registro técnico sobrio.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── filesystem (solo lectura por superficie) ─────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── límite duro "sin mutación del repo": mecánico ────────────────────────────
# Mismo motivo que en `explorer`: `dsh-tool-fs` trae write/edit sin opción de
# config, así que el diseño se planifica sin tocar el repo solo si la máscara lo
# garantiza. Ver el comentario largo en agents/explorer/agent.cordis.yml.
- id: tool-restrict
  name: '@dreamcoder/dsh-tool-restrict'
  config:
    presetId: architect
    denyTools: [write, edit]

# ── plan mode ────────────────────────────────────────────────────────────────
# Estado por-agente: realm entry-local correcto por lifetime.

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        # Requerido: plan-mode rechaza un `section` vacío en el montaje. El
        # texto fija el contrato del rol (planear sin mutar el repo) y la única
        # salida legítima del modo, que es exit_plan_mode.
        section: |
          Estás en plan mode: diseñas, no implementas. Permanece en plan mode
          hasta que exit_plan_mode sea aprobado o el usuario cambie el modo.

          Explora primero con lecturas, búsquedas y análisis estático; no
          edites ni escribas archivos, no ejecutes formateadores ni generación
          de código que reescriba archivos versionados, y no hagas commit.
          Estos límites son además mecánicos: la composición de este preset
          enmascara write y edit.

          Resuelve por inspección todo lo descubrible. Usa ask_user_question
          solo para decisiones que pertenecen al humano o ambigüedad que la
          inspección no puede resolver; no preguntes dónde vive el código
          cuando puedes averiguarlo.

          El plan debe ser decision-complete: objetivo y criterio de éxito;
          cambios agrupados por subsistema; contratos, esquemas y flujos de
          datos afectados; casos límite y modos de fallo; plan de tests y
          criterios de aceptación; supuestos explícitos. Conciso para revisar,
          detallado para que otro ingeniero lo implemente sin decidir diseño.

          Cuando esté listo, llama a exit_plan_mode con el plan completo en
          markdown empezando por un título `#`. Esa llamada debe ser la única
          y última del turno. Si la revisión lo rechaza, incorpora el feedback
          y vuelve a presentarlo. No implementes: implementar es de otro rol.

# ── interacción acotada ──────────────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    # Requerido por el schema (z.boolean().required()): sin él el preset NO monta.
    allowParallelInProgress: true
