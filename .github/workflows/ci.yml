name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  tooling:
    name: Tooling (typecheck + docs integrity)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (tsgo)
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # Gates mecánicos de la capa engineering: la deny-list P5 del
      # security-gate y el stage-check anti-secretos se auto-verifican con las
      # mismas sondas que usa un operador. Fallar aquí = política §3–§4 rota
      # en el propio repo que la declara.
      - name: Mechanical gates self-check
        run: |
          set -e
          if node scripts/security-gate.ts command -- git reset --hard; then
            echo "security-gate NO bloqueó git reset --hard" >&2; exit 1
          fi
          if node scripts/security-gate.ts command -- rm -rf /tmp/probe-x; then
            echo "security-gate NO bloqueó rm -rf" >&2; exit 1
          fi
          node scripts/security-gate.ts classify -- pnpm test | grep -q 'P2'
          node scripts/security-gate.ts stage-check
          echo '✔ gates mecánicos OK'

      - name: Vanguardia (update-guard offline)
        run: node scripts/update-guard.ts --offline

      - name: Docs link and path integrity
        run: |
          python3 - <<'EOF'
          import re, os, glob, sys
          errors = []
          md_files = ['README.md'] + glob.glob('docs/*.md')
          for f in md_files:
              text = open(f).read()
              for m in re.finditer(r'\]\(([^)#]+?)(#[^)]*)?\)', text):
                  target = m.group(1)
                  if target.startswith(('http', 'mailto')):
                      continue
                  p = os.path.normpath(os.path.join(os.path.dirname(f), target))
                  if not os.path.exists(p):
                      errors.append(f'{f}: broken link -> {target}')
              for m in set(re.findall(
                  r'`((?:bundles|agents|workflows|policy|memory|profiles|scripts|docs)/[A-Za-z0-9_./-]+)`',
                  text,
              )):
                  if not os.path.exists(m.rstrip('/')):
                      errors.append(f'{f}: missing path -> {m}')
          if errors:
              print('ERRORS:')
              for e in errors:
                  print(' -', e)
              sys.exit(1)
          print('ALL OK')
          EOF

  # La verificación de composición (pnpm verify) necesita un `dsh` real y
  # el perfil instalado en DSH_HOME; no es reproducible en el runner estándar.
  # Se ejecuta best-effort para detectar rupturas obvias sin bloquear el gate
  # principal. El gate autoritativo sigue siendo la máquina con instalación
  # local: pnpm verify && bash scripts/dream-doctor.sh.
  composition:
    name: Composition (best-effort, requires dsh)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify composition
        run: pnpm verify
