name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  tooling:
    name: Tooling (typecheck + suite + gates)
    runs-on: ubuntu-latest
    steps:
      # Acciones fijadas por SHA, no por etiqueta móvil: una etiqueta como `v4`
      # puede repuntarse a otro commit sin que este repositorio cambie, lo que
      # deja la cadena de suministro de CI apuntando a un blanco móvil. El
      # comentario conserva la referencia legible y Dependabot
      # (.github/dependabot.yml) propone los siguientes pines.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (tsgo)
        run: pnpm typecheck

      # Guard anti "verde porque nada corrió". Comprobado en este repo:
      #   node --test 'scripts/no-existe-*.test.ts'  →  exit 0, "# fail 0"
      # Es decir, una suite VACÍA es indistinguible de una suite verde. El piso
      # es un trinquete deliberado: si una baja de tests es legítima, se baja el
      # número en el mismo commit y se explica en el mensaje.
      - name: Unit tests (con piso de suite)
        run: |
          set -o pipefail
          node --test --test-reporter=tap 'scripts/*.test.ts' | tee /tmp/tap.txt
          total="$(sed -n 's/^# tests \([0-9][0-9]*\)$/\1/p' /tmp/tap.txt | tail -1)"
          if [ -z "$total" ] || [ "$total" -lt 150 ]; then
            echo "::error::la suite corrió ${total:-0} test(s), piso 150 — ¿el glob dejó de casar ficheros?"
            exit 1
          fi
          echo "✔ $total tests ejecutados (piso 150)"

      # Host-free verificado con PATH sin `dsh` y DSH_HOME inexistente: exit 0.
      # Corre el gate explícito además del test que lo ejercita, para que el
      # fallo se lea como "contrato roto" y no como "un test más".
      - name: Contratos (host-free)
        run: node scripts/verify-contracts.ts

      # Gates mecánicos de la capa engineering: la deny-list P5 del
      # security-gate y el stage-check anti-secretos se auto-verifican con las
      # mismas sondas que usa un operador. Fallar aquí = política §3–§4 rota
      # en el propio repo que la declara.
      - name: Mechanical gates self-check
        run: |
          set -e
          if node scripts/security-gate.ts command -- git reset --hard; then
            echo "security-gate NO bloqueó git reset --hard" >&2; exit 1
          fi
          if node scripts/security-gate.ts command -- rm -rf /tmp/probe-x; then
            echo "security-gate NO bloqueó rm -rf" >&2; exit 1
          fi
          node scripts/security-gate.ts classify -- pnpm test | grep -q 'P2'
          node scripts/security-gate.ts stage-check
          echo '✔ gates mecánicos OK'

      # Mini-bench driven: solo las jornadas que el corpus declara
      # `requires: 'none'`. `scripts/bench-coverage.test.ts` compara esta lista
      # con el corpus en las DOS direcciones, para que una jornada nueva no
      # quede fuera de CI en silencio ni una dependiente del host se cuele y
      # rompa el runner. El gate autoritativo completo —j5 y j6 necesitan un
      # `dsh` real y una instalación— es `pnpm bench` en la máquina local.
      - name: Mini-bench driven (host-free journeys)
        run: node scripts/dream-bench.ts --only j1,j2,j3,j4,j7,j8

      - name: Vanguardia (update-guard offline)
        run: node scripts/update-guard.ts --offline

      - name: Docs link and path integrity
        run: |
          python3 - <<'EOF'
          import re, os, glob, sys
          errors = []
          md_files = ['README.md'] + glob.glob('docs/*.md')
          for f in md_files:
              text = open(f).read()
              for m in re.finditer(r'\]\(([^)#\n]+?)(#[^)\n]*)?\)', text):
                  target = m.group(1)
                  if target.startswith(('http', 'mailto')):
                      continue
                  p = os.path.normpath(os.path.join(os.path.dirname(f), target))
                  if not os.path.exists(p):
                      errors.append(f'{f}: broken link -> {target}')
              for m in set(re.findall(
                  r'`((?:bundles|agents|workflows|policy|memory|profiles|scripts|docs)/[A-Za-z0-9_./-]+)`',
                  text,
              )):
                  if not os.path.exists(m.rstrip('/')):
                      errors.append(f'{f}: missing path -> {m}')
          if errors:
              print('ERRORS:')
              for e in errors:
                  print(' -', e)
              sys.exit(1)
          print('ALL OK')
          EOF

  # La verificación de composición (pnpm verify) necesita un `dsh` real y
  # el perfil instalado en DSH_HOME; no es reproducible en el runner estándar.
  # Sin dsh el job se omite con notice; con dsh es estricto. El gate
  # autoritativo sigue siendo la máquina con instalación local:
  # pnpm verify && bash scripts/dream-doctor.sh.
  # `continue-on-error` eliminado: con el guard de dsh en el workflow, este job
  # ahora es determinista (verde limpio sin dsh, estricto con dsh).
  composition:
    name: Composition (skips without dsh)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # La verificación de composición necesita un `dsh` real y el perfil
      # instalado en DSH_HOME; no es reproducible en el runner estándar. Si el
      # binario no existe se OMITE con notice (exit 0) — nunca una ❌ permanente
      # en Actions. El gate autoritativo es la máquina local: pnpm verify.
      - name: Verify composition
        run: |
          if ! command -v dsh >/dev/null 2>&1; then
            echo "::notice::dsh no disponible en este runner — verificación de composición omitida. Gate autoritativo local: pnpm verify && bash scripts/dream-doctor.sh"
            exit 0
          fi
          pnpm verify
